name: ci_deterministic_suite
cases: datasets/support.jsonl
spending_cap_usd: 1.00
max_concurrency: 4
max_retries: 2
seed: 42

configs:
  - id: baseline
    provider: fixture
    model: fixture-v1
    prompt: prompts/support_v1.txt
    temperature: 0.0
    max_tokens: 250

  - id: candidate
    provider: fixture
    model: fixture-v1
    prompt: prompts/support_v2.txt
    temperature: 0.0
    max_tokens: 250

scorers:
  - contains
  - semantic_similarity
  - citation
  - rubric: rubrics/helpful.yaml
